version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chicago_safety_db
    environment:
      POSTGRES_USER: chicago
      POSTGRES_PASSWORD: chicago
      POSTGRES_DB: chicago_safety
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chicago -d chicago_safety"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
